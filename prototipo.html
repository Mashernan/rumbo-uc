<style>

/* plataforma web */
.web{display:grid;grid-template-columns:240px 1fr;gap:1rem;align-items:start}

.bar{height:8px;border-radius:999px;background:#e3e9ee;overflow:hidden;width:100%}

.hero h1{font-size:1.8rem;color:#fff}

.entry{display:flex;flex-direction:column;gap:.5rem}
.entry .btn{align-self:flex-start}
.flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.85rem;margin:.3rem 0 .8rem}

@media (max-width:860px){

}
@media (max-width:480px){
  main{padding:.5rem}

@media (prefers-reduced-motion:no-preference){.btn,.slot,.opt{transition:background .15s,border-color .15s}}
</style>

<script>
"use strict";
/* ====================== utilidades ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go = h => { if (location.hash === "#" + h) render(); else location.hash = h; };
function toast(msg){ const l=$("#toasts"); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; l.appendChild(t); setTimeout(()=>t.remove(),3200); }
function modal(title, bodyHTML, actions){
  const l=$("#layer"); const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><h2 id="mdl-t">${title}</h2><div>${bodyHTML}</div><div class="row" style="justify-content:flex-end;margin-top:1rem" id="mdl-a"></div></div>`;
  (actions||[{label:"Cerrar"}]).forEach(a=>{ const b=document.createElement("button"); b.className="btn "+(a.cls||""); b.textContent=a.label; b.onclick=()=>{ if(a.fn && a.fn(bg)===false) return; bg.remove(); }; $("#mdl-a",bg).appendChild(b); });
  bg.addEventListener("keydown",e=>{ if(e.key==="Escape") bg.remove(); });
  l.appendChild(bg); const f=$("button,input,textarea,select",bg.querySelector(".modal div")) || $("#mdl-a button",bg); f && f.focus();
  return bg;
}
function setErr(input, msg){
  const id = input.id + "-err"; let e = document.getElementById(id);
  if(!msg){ input.removeAttribute("aria-invalid"); if(e) e.remove(); return true; }
  input.setAttribute("aria-invalid","true"); input.setAttribute("aria-describedby", id);
  if(!e){ e=document.createElement("div"); e.className="err"; e.id=id; e.setAttribute("role","alert"); input.insertAdjacentElement("afterend", e); }
  e.textContent = msg; return false;
}
const store = { get(k,d){ try{ const v=localStorage.getItem("rumboproto_"+k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem("rumboproto_"+k, JSON.stringify(v)); }catch(e){} } };
const icon = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6.2 4.6 1.9 5.4 5.4"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4.2-6.5 8-6.5s7 2.1 8 6.5"/></svg>'
};

/* ====================== datos ficticios ====================== */
const NOMBRES = ["Lucía Ramos","Diego Huamán","Valeria Torres","Joaquín Paredes","Camila Rojas","Mateo Quispe","Ariana Salazar","Sebastián Lazo","Fernanda Ccori","Rodrigo Medina","Daniela Ponce","Gabriel Inga","Mariana Vega","Thiago Cárdenas","Ximena Arias","Bruno Espinoza","Antonella Ríos","Adrián Soto","Luana Mendoza","Iker Flores","Renata Chávez","Samuel Ortiz","Abril Castro","Leonardo Vargas","Micaela Núñez","Gael Palomino","Zoe Aquino","Emilio Benavides","Alessia Ruiz","Facundo Tello","Isabella Cruz","Matías Gamarra","Julieta Montes","Santiago Rivas","Kiara Lozano","Nicolás Yupanqui","Ainhoa Campos","Dylan Mamani","Ariadna León","Franco Villena"];
const CARRERAS = ["Ing. de Sistemas","Ing. Industrial"];
const CURSOS = ["Matemática Básica","Comunicación","Fundamentos de Programación","Física I","Química General","Introducción a la Ingeniería"];
function rnd(seed){ let x=Math.sin(seed)*10000; return x-Math.floor(x); }
const STUDENTS = NOMBRES.map((n,i)=>{
  const r1=rnd(i+1), r2=rnd(i+11), r3=rnd(i+21), r4=rnd(i+31);
  const asist=Math.round(55+r1*45), prom=Math.round((7+r2*11)*10)/10, desap=Math.floor(r3*4), inact=Math.floor(r4*16);
  return { id:i+1, cod:"U2026"+String(1000+i*37).padStart(5,"0"), nombre:n, carrera:CARRERAS[i%2], ciclo:1+(i%2), curso:CURSOS[i%6],
           asist, prom, desap, inact, hist:[0,1,2].map(k=>Math.round(20+rnd(i*7+k)*60)), contactado:i%5===0, tutor:i<40?"rq":"otro" };
});
STUDENTS[0] = Object.assign(STUDENTS[0], {asist:62, prom:9.4, desap:2, inact:5, hist:[35,52,68]});
STUDENTS[1] = Object.assign(STUDENTS[1], {asist:68, prom:10.2, desap:2, inact:3, hist:[40,48,61]});
STUDENTS[2] = Object.assign(STUDENTS[2], {asist:71, prom:10.8, desap:1, inact:11, hist:[30,40,72]});
const OTRO = {id:99, cod:"U202609911", nombre:"Estudiante de otro tutor", carrera:"Ing. Civil", ciclo:1, curso:"Física I", asist:80, prom:13, desap:0, inact:1, hist:[20,20,20], tutor:"otro"};
let RULES = store.get("rules", {asist:75, prom:11, desap:2, inact:7, w:{asist:35, prom:30, desap:20, inact:15}});
function risk(s){
  const f = {asist:s.asist<RULES.asist, prom:s.prom<RULES.prom, desap:s.desap>=RULES.desap, inact:s.inact>=RULES.inact};
  const score = (f.asist?RULES.w.asist:0)+(f.prom?RULES.w.prom:0)+(f.desap?RULES.w.desap:0)+(f.inact?RULES.w.inact:0);
  const nivel = score>=60?"alto":score>=30?"medio":"bajo";
  return {score, nivel, f};
}
const NIVEL_TXT = {alto:"Riesgo alto", medio:"Riesgo medio", bajo:"Riesgo bajo"};
const lvl = n => `<span class="chip ${n}"><span class="dot ${n}" aria-hidden="true"></span>${NIVEL_TXT[n]}</span>`;

function parseCSV(txt, name){
  const lines = txt.trim().split(/\r?\n/); const head = lines[0].split(",").map(x=>x.trim().toLowerCase());
  const need = ["codigo","curso","periodo","evaluacion","nota","asistencia"]; const falt = need.filter(n=>!head.includes(n));
  if(falt.length) return {ok:false, msg:`Faltan columnas obligatorias: ${falt.join(", ")}. La carga se rechazó y no se modificaron los datos.`};
  const errs=[]; let p=0; const seen=new Set();
  lines.slice(1).forEach((l,k)=>{ const c=l.split(","); const o={}; head.forEach((h,i)=>o[h]=(c[i]||"").trim());
    const n=Number(o.nota), a=Number(o.asistencia); const key=o.codigo+o.curso+o.evaluacion;
    if(!/^U\d{9}$/.test(o.codigo)) errs.push([k+2,"Código con formato inválido"]);
    else if(isNaN(n)||n<0||n>20) errs.push([k+2,"Nota fuera del rango 0–20"]);
    else if(isNaN(a)||a<0||a>100) errs.push([k+2,"Asistencia fuera del rango 0–100"]);
    else if(seen.has(key)) errs.push([k+2,"Registro duplicado"]);
    else { seen.add(key); p++; } });
  return {ok:true, p, errs, name};
}

  <li>Prueba la accesibilidad con «A+» (texto grande) y «Contraste». Todo se puede usar con el teclado.</li>
  <li>El <a href="#mapa">mapa de pantallas</a> lista todas las interfaces con su historia de usuario.</li></ul></div>`;
V["mapa"] = () => { const ids=Object.keys(SCREENS); const hus={}; ids.forEach(id=>SCREENS[id].hu.forEach(h=>(hus[h]=hus[h]||[]).push(SCREENS[id].n)));
  return `<h1>Mapa de pantallas</h1><p class="muted">28 interfaces · 18 historias de usuario cubiertas</p>
  <div class="grid g2"><div class="card"><h2>Interfaces</h2><table><thead><tr><th>N.°</th><th>Interfaz</th><th>HU</th></tr></thead><tbody>
  ${ids.map(id=>`<tr><td>${SCREENS[id].n}</td><td><a href="#${id}">${esc(SCREENS[id].t)}</a><br><small class="muted">${id.startsWith("app")?"App móvil":"Plataforma web"}</small></td><td>${SCREENS[id].hu.map(h=>`<span class="chip hu">${h}</span>`).join(" ")}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h2>Cobertura por historia</h2><table><thead><tr><th>HU</th><th>Interfaces</th></tr></thead><tbody>
  ${Object.keys(hus).sort().map(h=>`<tr><td><span class="chip hu">${h}</span></td><td>${hus[h].join(", ")}</td></tr>`).join("")}</tbody></table></div></div>`; };

/* ====================== enrutador ====================== */
function render(){
  let id = location.hash.slice(1) || "inicio"; if(!V[id]) id = "inicio";
  if(id==="app-login" && APP.logged && APP.consent) id="app-home";
  const html = V[id](); if(html==="") return;
  const view=$("#view"); view.innerHTML = html;
  $$(".topnav a").forEach(a=>a.toggleAttribute("aria-current", a.dataset.top===(id.startsWith("app")?"app":id.startsWith("web")?"web":id)));
  if(a11yPending) a11yPending=false; else view.focus({preventScroll:true});
  window.scrollTo(0,0);
  document.title = (SCREENS[id]?SCREENS[id].n+" "+SCREENS[id].t+" – ":"")+"RUMBO_UC – Prototipo navegable";
  bind(id);
}
let a11yPending=false;
function bind(id){
  const on=(sel,ev,fn)=>{ const e=$(sel); if(e) e.addEventListener(ev,fn); };
  if(id==="app-login") on("#sso","click",()=>{ $("#sso").disabled=true; $("#sso-state").innerHTML='<p class="hint" style="text-align:center">Conectando con el inicio de sesión institucional…</p>'; setTimeout(()=>{ APP.logged=true; go(APP.consent?"app-home":"app-consent"); },700); });
  if(id==="app-consent"){ on("#cs-ok","change",e=>$("#cs-go").disabled=!e.target.checked); on("#cs-go","click",()=>{ APP.consent=true; APP.revocado=false; store.set("consent",true); toast("Consentimiento registrado: versión 1.0, 21/11/2026"); go("app-home"); }); }
  if(id==="app-test"){ const t=APP.test;
    $$('input[name=q]').forEach(r=>r.addEventListener("change",()=>{ t.r[t.i]=r.value; store.set("test",t); $("#q-err").textContent=""; }));
    on("#q-prev","click",()=>{ t.i=Math.max(0,t.i-1); store.set("test",t); render(); });
    on("#q-next","click",()=>{ if(t.r[t.i]===undefined){ $("#q-err").textContent="Elige una respuesta para continuar."; return; } if(t.i===PREG.length-1){ t.done=true; store.set("test",t); go("app-test-result"); } else { t.i++; store.set("test",t); render(); } });
    on("#q-save","click",()=>{ store.set("test",t); toast("Avance guardado. Puedes continuar cuando quieras."); go("app-home"); }); }
  if(id==="app-test-result"){ on("#share","change",e=>{ APP.test.share=e.target.checked; store.set("test",APP.test); toast(e.target.checked?"Tu tutora podrá ver tus respuestas.":"Tus respuestas ya no se comparten."); }); on("#retest","click",()=>{ APP.test={i:0,r:{}}; store.set("test",APP.test); go("app-test"); }); }
  if(id==="app-agenda"){ let sel=null;
    $$(".slot").forEach(b=>b.addEventListener("click",()=>{ $$(".slot").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=SLOTS[b.dataset.k]; $("#slot-err").textContent=""; }));
    on("#motivo","input",e=>$("#mot-c").textContent=e.target.value.length);
    on("#cita-go","click",()=>{ const m=$("#motivo"); let ok=true; if(!sel){ $("#slot-err").textContent="Elige un horario disponible."; ok=false; }
      if(!setErr(m, m.value.trim().length<10?"Escribe el motivo con al menos 10 caracteres.":"")) ok=false;
      if(ok){ APP.cita={dia:sel[0],hora:sel[1]}; toast("Solicitud enviada a la Ing. Rosa Quispe"); render(); } }); }
  if(id==="app-mentor") $$("[data-mentor]").forEach(b=>b.addEventListener("click",()=>{ b.disabled=true; b.textContent="Enviada"; toast("Solicitud enviada. Te avisaremos cuando responda."); setTimeout(()=>{ APP.mentorPedido=b.dataset.mentor; if(location.hash==="#app-mentor") render(); toast(b.dataset.mentor+" aceptó tu solicitud"); },1500); }));
  if(id==="app-mentor-chat"||id==="app-group-chat") on("#chat-f","submit",e=>{ e.preventDefault(); const i=$("#msg"); const v=i.value.trim();
      if(!setErr(i, !v?"Escribe un mensaje.":v.length>500?"Máximo 500 caracteres.":"")) return;
      const k=e.target.dataset.k; CHATS[k].push({me:true,t:v,who:"Tú"}); render(); $("#msg").focus(); });
  if(id==="app-repo"){ on("#rq","input",e=>{ APP.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#rq"); n.focus(); n.setSelectionRange(p,p); }); $$("[data-mat]").forEach(a=>a.addEventListener("click",()=>APP.mat=Number(a.dataset.mat))); }
  if(id==="app-upload"){ let sim=null;
    on("#up-ok","click",()=>{ sim={name:"resumen_unidad2.pdf", size:1.2e6, virus:false}; $("#up-state").innerHTML='<p class="hint">Archivo simulado: resumen_unidad2.pdf (1.2 MB)</p>'; });
    on("#up-bad","click",()=>{ sim={name:"apuntes.pdf", size:0.8e6, virus:true}; $("#up-state").innerHTML='<p class="hint">Archivo simulado: apuntes.pdf (0.8 MB)</p>'; });
    on("#up-f","submit",e=>{ e.preventDefault(); const c=$("#up-curso"), t=$("#up-tit"), f=$("#up-file"); let ok=true;
      ok = setErr(c, c.value?"":"Selecciona el curso.") && ok;
      ok = setErr(t, t.value.trim().length<5?"El título debe tener al menos 5 caracteres.":"") && ok;
      const file = f.files[0] ? {name:f.files[0].name, size:f.files[0].size, virus:false} : sim;
      let fe=""; if(!file) fe="Adjunta un archivo."; else if(!/\.(pdf|docx|pptx|png|jpe?g)$/i.test(file.name)) fe="Formato no permitido. Usa PDF, DOCX, PPTX, PNG o JPG."; else if(file.size>20*1024*1024) fe="El archivo supera los 20 MB.";
      ok = setErr(f, fe) && ok; if(!ok) return;
      $("#up-state").innerHTML='<div class="banner info" role="status">Analizando el archivo con antivirus…</div>';
      setTimeout(()=>{ if(file.virus){ $("#up-state").innerHTML='<div class="banner bad" role="alert"><div><strong>Archivo bloqueado.</strong> El antivirus detectó una amenaza; el material no se publicó.</div></div>'; return; }
        MATERIALES.unshift({id:Date.now(), curso:c.value, titulo:t.value.trim(), autor:"Lucía Ramos", tipo:file.name.split(".").pop().toUpperCase(), tam:(file.size/1e6).toFixed(1)+" MB", rating:0, votos:0, comentarios:[], descargado:true});
        toast("Material publicado en "+c.value); go("app-repo"); },900); }); }
  if(id==="app-material"){ const m=MATERIALES.find(x=>x.id===(APP.mat||1));
    $$("[data-star]").forEach(b=>b.addEventListener("click",()=>{ const k=Number(b.dataset.star); m.rating=Math.round(((m.rating*m.votos)+k)/(m.votos+1)*10)/10; m.votos++; m.mio=k; toast("Gracias por tu calificación"); render(); }));
    on("#com-go","click",()=>{ const c=$("#com"); const v=c.value.trim(); if(!setErr(c, !v?"Escribe un comentario.":"")) return; m.comentarios.unshift(v); render(); });
    on("#dl","click",()=>{ m.descargado=true; toast(APP.offline?"Abriendo copia descargada":"Material disponible sin conexión"); render(); });
    on("#rep","click",()=>modal("Reportar material", `<p>¿Por qué quieres reportar «${esc(m.titulo)}»?</p><label for="rp-m">Motivo</label><select id="rp-m"><option value="">Selecciona un motivo</option><option>Contenido incorrecto</option><option>Contenido ofensivo</option><option>Infracción de derechos de autor</option><option>No corresponde al curso</option></select>`,
      [{label:"Cancelar",cls:"sec"},{label:"Enviar reporte",fn:bg=>{ const s=$("#rp-m",bg); if(!setErr(s, s.value?"":"Selecciona un motivo.")) return false; REPORTES.push({id:Date.now(),material:m.titulo,motivo:s.value,por:"Lucía Ramos",fecha:"2026-11-21"}); toast("Reporte enviado a moderación. Te avisaremos la decisión."); }}])); }
  if(id==="app-groups"){ $$("[data-join]").forEach(b=>b.addEventListener("click",()=>{ const g=GRUPOS.find(x=>x.id==b.dataset.join); if(g.miembros>=15){ toast("Este grupo está completo."); return; } g.unido=true; g.miembros++; toast("Te uniste a "+g.nombre); render(); }));
    $$("[data-grp]").forEach(a=>a.addEventListener("click",()=>APP.grp=Number(a.dataset.grp)));
    on("#g-new","click",()=>modal("Crear grupo de estudio", `<label for="g-n">Nombre del grupo</label><input type="text" id="g-n" maxlength="60"><label for="g-c">Curso</label><select id="g-c"><option value="">Selecciona un curso</option>${CURSOS.map(c=>`<option>${c}</option>`).join("")}</select>`,
      [{label:"Cancelar",cls:"sec"},{label:"Crear",fn:bg=>{ const n=$("#g-n",bg), c=$("#g-c",bg); const a=setErr(n, n.value.trim().length<5?"Mínimo 5 caracteres.":""); const b=setErr(c, c.value?"":"Selecciona el curso."); if(!(a&&b)) return false; GRUPOS.unshift({id:Date.now(),nombre:n.value.trim(),curso:c.value,miembros:1,unido:true}); toast("Grupo creado"); setTimeout(render,0); }}])); }
  if(id==="app-profile"){ on("#p-lg","change",e=>setSize(e.target.checked)); on("#p-hc","change",e=>setHC(e.target.checked)); on("#p-off","change",e=>{ APP.offline=e.target.checked; render(); });
    on("#revoke","click",()=>modal("Revocar consentimiento","<p>Si revocas el consentimiento, dejarás de recibir alertas y tu tutora no verá tu seguimiento académico. Podrás volver a aceptarlo cuando quieras.</p>",[{label:"Cancelar",cls:"sec"},{label:"Revocar",cls:"danger",fn:()=>{ APP.revocado=true; toast("Consentimiento revocado el 21/11/2026"); setTimeout(render,0); }}]));
    on("#reaccept","click",()=>{ APP.revocado=false; APP.consent=false; go("app-consent"); });
    on("#logout","click",()=>{ APP.logged=false; go("app-login"); }); }
  if(id==="web-login") $$("[data-role]").forEach(b=>b.addEventListener("click",()=>{ WEB.role=b.dataset.role; go(MENU[WEB.role][0][0]); }));
  if(id==="web-dashboard"){ const F=WEB.filtro; const upd=()=>{ F.q=$("#f-q").value; F.nivel=$("#f-n").value; F.curso=$("#f-c").value; F.carrera=$("#f-k").value; const foc=document.activeElement.id; const p=document.activeElement.selectionStart; render(); const n=document.getElementById(foc); if(n){ n.focus(); if(foc==="f-q") n.setSelectionRange(p,p); } };
    ["#f-n","#f-c","#f-k"].forEach(s=>on(s,"change",upd)); on("#f-q","input",upd);
    $$("tr[data-st]").forEach(tr=>{ const open=()=>{ WEB.st=Number(tr.dataset.st); go("web-student"); }; tr.addEventListener("click",open); tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } }); });
    on("#otro","click",()=>{ WEB.denied={t:"Detalle de "+OTRO.cod+" (no es tu tutorado)"}; AUDIT.unshift({f:"2026-11-21 "+new Date().toTimeString().slice(0,5),u:"rq.tutor@ejemplo.edu",a:"Ver detalle de estudiante",r:OTRO.cod,res:"Denegado"}); go("web-denegado"); }); }
  if(id==="web-student") on("#contact","click",()=>{ const a=AVISOS.find(x=>x.st===WEB.st); if(a) a.done=true; toast("Contacto registrado. El aviso pasó a «Atendido»."); });
  if(id==="web-tutoria"){ on("#tu-a","input",e=>$("#tu-c").textContent=e.target.value.length);
    on("#tu-f","submit",e=>{ e.preventDefault(); const es=$("#tu-e"), d=$("#tu-d"), s=$("#tu-s"), a=$("#tu-a"); let ok=true;
      ok=setErr(es, es.value?"":"Selecciona al estudiante.")&&ok;
      ok=setErr(d, !d.value?"Indica la fecha de la sesión.":d.value>"2026-11-21"?"La fecha de la sesión no puede ser futura.":"")&&ok;
      ok=setErr(s, s.value && d.value && s.value<=d.value?"La fecha de seguimiento debe ser posterior a la sesión.":"")&&ok;
      ok=setErr(a, a.value.trim().length<20?"Describe los acuerdos con al menos 20 caracteres.":"")&&ok;
      if(!ok){ $("[aria-invalid=true]").focus(); return; }
      TUTORIAS.unshift({est:Number(es.value), fecha:d.value, modalidad:$("#tu-m").value, acuerdos:a.value.trim(), seg:s.value}); store.set("tutorias",TUTORIAS);
      const av=AVISOS.find(x=>x.st===Number(es.value)); if(av) av.done=true;
      toast("Tutoría registrada"+(s.value&&$("#tu-r").checked?" · recordatorio programado para el "+s.value:"")); WEB.st=Number(es.value); WEB.pre=null; go("web-student"); }); }
  if(id==="web-avisos") $$("[data-aviso]").forEach(b=>b.addEventListener("click",()=>{ AVISOS.find(x=>x.st==b.dataset.aviso).done=true; toast("Contacto registrado"); render(); }));
  if(id==="web-import"){ const show=r=>{ const box=$("#imp-res");
      if(!r.ok){ box.innerHTML=`<div class="banner bad" role="alert">${esc(r.msg)}</div>`; return; }
      if(r.errs.length){ box.innerHTML=`<div class="banner bad" role="alert"><div><strong>Carga rechazada.</strong> Se encontraron ${r.errs.length} error(es); no se modificaron los datos existentes.</div></div><table><thead><tr><th>Fila</th><th>Motivo</th></tr></thead><tbody>${r.errs.map(e=>`<tr><td>${e[0]}</td><td>${esc(e[1])}</td></tr>`).join("")}</tbody></table>`; CARGAS.unshift({f:"2026-11-21 "+new Date().toTimeString().slice(0,5),u:"ti.carga@ejemplo.edu",a:r.name,p:0,x:r.errs.length}); }
      else { box.innerHTML=`<div class="banner ok" role="status"><div><strong>Carga completada.</strong> ${r.p} registros procesados, 0 rechazados. El semáforo se recalculará automáticamente.</div></div>`; CARGAS.unshift({f:"2026-11-21 "+new Date().toTimeString().slice(0,5),u:"ti.carga@ejemplo.edu",a:r.name,p:r.p,x:0}); }
      store.set("cargas",CARGAS); };
    const OK="codigo,curso,periodo,evaluacion,nota,asistencia\nU202601000,Matemática Básica,2026-2,PC3,12,80\nU202601037,Matemática Básica,2026-2,PC3,9,62\nU202601074,Física I,2026-2,PC3,14,90\nU202601111,Comunicación,2026-2,PC3,16,95";
    const BAD="codigo,curso,periodo,evaluacion,nota,asistencia\nU202601000,Matemática Básica,2026-2,PC3,12,80\nU20260XX37,Matemática Básica,2026-2,PC3,9,62\nU202601074,Física I,2026-2,PC3,24,90\nU202601000,Matemática Básica,2026-2,PC3,12,80";
    on("#imp-ok","click",()=>show(parseCSV(OK,"notas_2026-2_s11.csv"))); on("#imp-bad","click",()=>show(parseCSV(BAD,"notas_con_errores.csv")));
    on("#imp-f","change",e=>{ const f=e.target.files[0]; if(!f) return; if(!/\.csv$/i.test(f.name)){ setErr(e.target,"Solo se aceptan archivos .csv."); return; } if(f.size>10*1024*1024){ setErr(e.target,"El archivo supera los 10 MB."); return; } setErr(e.target,""); const rd=new FileReader(); rd.onload=()=>show(parseCSV(String(rd.result), f.name)); rd.readAsText(f); }); }
  if(id==="web-reglas"){ const ids=["#w-a","#w-p","#w-d","#w-i"]; const sum=()=>{ const s=ids.reduce((a,k)=>a+Number($(k).value||0),0); $("#w-sum").textContent=`Suma de pesos: ${s} %`+(s===100?" ✓":" (debe ser 100 %)"); return s; };
    ids.forEach(k=>on(k,"input",sum)); sum();
    on("#rg-reset","click",()=>{ RULES={asist:75,prom:11,desap:2,inact:7,w:{asist:35,prom:30,desap:20,inact:15}}; store.set("rules",RULES); render(); toast("Valores restablecidos"); });
    on("#rg-f","submit",e=>{ e.preventDefault(); let ok=true; [["#r-a",50,100],["#r-p",5,20],["#r-d",1,10],["#r-i",1,60]].forEach(([k,mn,mx])=>{ const v=Number($(k).value); ok=setErr($(k), $(k).value===""||v<mn||v>mx?`Valor entre ${mn} y ${mx}.`:"")&&ok; });
      if(sum()!==100){ $("#rg-err").textContent="Los pesos deben sumar 100 %."; ok=false; } else $("#rg-err").textContent="";
      if(!ok) return; const before=STUDENTS.filter(s=>risk(s).nivel==="alto").length;
      RULES={asist:Number($("#r-a").value),prom:Number($("#r-p").value),desap:Number($("#r-d").value),inact:Number($("#r-i").value),w:{asist:Number($("#w-a").value),prom:Number($("#w-p").value),desap:Number($("#w-d").value),inact:Number($("#w-i").value)}};
      store.set("rules",RULES); const after=STUDENTS.filter(s=>risk(s).nivel==="alto").length;
      AUDIT.unshift({f:"2026-11-21 "+new Date().toTimeString().slice(0,5),u:"cb.coord@ejemplo.edu",a:"Modificar reglas del semáforo",r:"Umbrales y pesos",res:"Permitido"});
      toast(`Reglas guardadas. Estudiantes en riesgo alto: ${before} → ${after}`); }); }
  if(id==="web-mentores"){ $$("[data-verif]").forEach(b=>b.addEventListener("click",()=>{ const m=MENTORES.find(x=>x.id==b.dataset.verif); m.verif=true; m.afinidad=78; toast(m.nombre+" quedó verificado y puede recibir solicitudes"); render(); }));
    $$("[data-cert]").forEach(b=>b.addEventListener("click",()=>{ const m=MENTORES.find(x=>x.id==b.dataset.cert); toast("Constancia de "+m.nombre+" generada ("+m.horas+" h) · simulado"); })); }
  if(id==="web-moderacion"){ $$("[data-keep]").forEach(b=>b.addEventListener("click",()=>{ const i=REPORTES.findIndex(x=>x.id==b.dataset.keep); REPORTES.splice(i,1); toast("Material mantenido; se notificó a quien reportó."); render(); }));
    $$("[data-del]").forEach(b=>b.addEventListener("click",()=>{ const r=REPORTES.find(x=>x.id==b.dataset.del); modal("Retirar material", `<p>Se retirará «${esc(r.material)}» y se notificará al autor.</p><label for="dm">Motivo para el autor</label><textarea id="dm" maxlength="300">${esc(r.motivo)}</textarea>`,
      [{label:"Cancelar",cls:"sec"},{label:"Retirar",cls:"danger",fn:bg=>{ const t=$("#dm",bg); if(!setErr(t, t.value.trim().length<10?"Indica el motivo (mínimo 10 caracteres).":"")) return false; REPORTES.splice(REPORTES.indexOf(r),1); toast("Material retirado y autor notificado"); setTimeout(render,0); }}]); })); }
  if(id==="web-reportes") $$("[data-exp]").forEach(b=>b.addEventListener("click",()=>{ const c=$("#rp-c"), k=$("#rp-k"); const a=setErr(c,c.value?"":"Selecciona la carrera."); const d=setErr(k,k.value?"":"Selecciona el ciclo."); if(a&&d) toast(`Reporte ${b.dataset.exp} generado: ${c.value}, ciclo ${k.value} · simulado`); }));
  if(id==="web-auditoria") on("#au-f","change",e=>{ WEB.af=e.target.value; render(); $("#au-f").focus(); });
}
/* ====================== accesibilidad global ====================== */
function setSize(v){ document.documentElement.classList.toggle("lg",v); $("#tg-size").setAttribute("aria-pressed",v); store.set("lg",v); }
function setHC(v){ document.body.classList.toggle("hc",v); $("#tg-hc").setAttribute("aria-pressed",v); store.set("hc",v); }
$("#tg-size").onclick=()=>{ setSize(!document.documentElement.classList.contains("lg")); a11yPending=true; render(); };
$("#tg-hc").onclick=()=>{ setHC(!document.body.classList.contains("hc")); a11yPending=true; render(); };
$("#tg-hu").onclick=e=>{ const v=document.body.classList.toggle("nohu"); e.currentTarget.setAttribute("aria-pressed",!v); };
$("#tg-ficha").onclick=e=>{ const v=document.body.classList.toggle("nofichas"); e.currentTarget.setAttribute("aria-pressed",!v); };
setSize(store.get("lg",false)); setHC(store.get("hc",false));
window.addEventListener("hashchange", render);
render();
</script>
