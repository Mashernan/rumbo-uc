<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plataforma web RUMBO_UC: dashboard de riesgo académico para tutores, Coordinación de Bienestar y TI.">
<link rel="icon" href="assets/icon-192.png">
<title>RUMBO_UC – Plataforma web</title>
<link rel="stylesheet" href="assets/rumbo.css">
</head>
<body>
<a class="skip" href="#view">Saltar al contenido</a>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="RUMBO_UC, volver al inicio del PMV"><img src="assets/icon-192.png" alt="" width="28" height="28" style="border-radius:7px">RUMBO_UC</a>
  <nav class="topnav" aria-label="Productos"><a href="app.html">App del estudiante</a><a href="web.html" aria-current="page">Plataforma web</a><a href="prototipo.html">Prototipo completo</a></nav>
  <span class="mode" id="modo"></span>
  <div class="a11y" role="group" aria-label="Opciones de visualización"><button id="tg-size" aria-pressed="false" title="Aumentar el tamaño del texto">A+</button><button id="tg-hc" aria-pressed="false" title="Alto contraste">Contraste</button></div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/rumbo-core.js"></script>
<script>
"use strict";
const api = crearApi();
initA11y();
$("#modo").textContent = api.modo === "supabase" ? "Conectado a Supabase" : "Modo demostración";
$("#modo").classList.toggle("live", api.modo === "supabase");
let U = null; const S = {filtro:{q:"", nivel:"", curso:"", carrera:""}, st:null, pre:null, denied:null, af:""};
const ROL_TXT = {tutor:"Tutora", coordinador:"Coordinación de Bienestar", ti:"Responsable de TI", estudiante:"Estudiante"};
const MENU = {
  tutor:[["tutorados","Mis tutorados"],["avisos","Avisos de riesgo"],["tutoria","Registrar tutoría"]],
  coordinador:[["tutorados","Tutorados (vista general)"],["avisos","Avisos y escalamientos"],["reglas","Reglas del semáforo"],["auditoria","Auditoría"],["r2-mentores","Mentores · R2"],["r2-moderacion","Moderación · R2"],["r2-reportes","Reportes · R2"]],
  ti:[["importar","Importar datos"],["auditoria","Auditoría"],["r2-rendimiento","Rendimiento · R2"]]
};
const ACCESS = {tutorados:["tutor","coordinador"], estudiante:["tutor","coordinador"], tutoria:["tutor"], avisos:["tutor","coordinador"], reglas:["coordinador"], auditoria:["coordinador","ti"],
  importar:["ti"], "r2-mentores":["coordinador"], "r2-moderacion":["coordinador"], "r2-reportes":["coordinador"], "r2-rendimiento":["ti"], denegado:["tutor","coordinador","ti"]};
const TITULO = {tutorados:"Tutorados", estudiante:"Detalle del estudiante", tutoria:"Registrar tutoría", avisos:"Avisos de riesgo alto", reglas:"Reglas del semáforo de riesgo", auditoria:"Auditoría de accesos",
  importar:"Importar datos académicos", denegado:"Acceso denegado", "r2-mentores":"Gestión de mentores", "r2-moderacion":"Moderación de materiales", "r2-reportes":"Reportes institucionales", "r2-rendimiento":"Rendimiento y disponibilidad"};
const HU = {tutorados:"HU06 · HU02", estudiante:"HU02 · HU17", tutoria:"HU07", avisos:"HU04", reglas:"HU02", auditoria:"HU17", importar:"HU01", denegado:"HU17", "r2-mentores":"HU10", "r2-moderacion":"HU12", "r2-reportes":"HU14", "r2-rendimiento":"HU16"};
function shell(id, inner, actions = ""){
  const t = id === "tutorados" && U.rol === "tutor" ? "Mis tutorados" : TITULO[id];
  return `<div class="web"><nav class="side" aria-label="Menú de la plataforma">
    <div class="who row"><div class="avatar" aria-hidden="true">${esc(U.nombres.replace(/^(Ing|Lic)\.\s*/,"").split(" ").map(x => x[0]).join("").slice(0,2))}</div><div><strong>${esc(U.nombres)}</strong><br><small class="muted">${ROL_TXT[U.rol]}</small></div></div>
    ${MENU[U.rol].map(([h, l]) => `<a href="#${h}" ${id === h || (id === "estudiante" && h === "tutorados") ? 'aria-current="page"' : ""}>${esc(l)}</a>`).join("")}
    <div class="sec-title">Sesión</div><a href="#salir" id="salir">Cerrar sesión</a>
    ${api.modo === "demo" ? '<a href="#reiniciar" id="reiniciar">Reiniciar datos de demo</a>' : ""}
   </nav><section aria-labelledby="pg-t"><div class="pagehead"><h1 id="pg-t">${esc(t)}</h1><span class="chip hu">${HU[id]}</span><span class="spacer"></span>${actions}</div>${inner}</section></div>`;
}
const trendSVG = (h, w = 90, hg = 26) => { h = (h || []).filter(x => x !== null); if (h.length < 2) return '<small class="muted">—</small>';
  const pts = h.map((v, i) => `${(i / (h.length - 1)) * w},${hg - (v / 100) * hg}`).join(" "); const up = h[h.length - 1] > h[0];
  return `<svg width="${w}" height="${hg}" viewBox="0 0 ${w} ${hg}" role="img" aria-label="Tendencia del puntaje de riesgo: ${h.join(", ")}${up ? ", en aumento" : ", estable o en baja"}"><polyline points="${pts}" fill="none" stroke="${up ? "#b3261e" : "#1e7a3a"}" stroke-width="2.2"/></svg>`; };

/* ===================== pantallas ===================== */
const V = {};
V.login = async () => `<div class="card login-box">
  <h1>Plataforma web RUMBO_UC</h1><p class="muted">Panel de riesgo académico para tutores, Coordinación de Bienestar y TI.</p>
  <form id="lg-f" novalidate><label for="lg-e">Correo institucional</label><input type="email" id="lg-e" autocomplete="username">
  <label for="lg-p">Contraseña</label><input type="password" id="lg-p" autocomplete="current-password">
  <div id="lg-err" class="err" role="alert"></div><button class="btn block" id="lg-go" style="margin-top:.9rem">Ingresar</button></form>
  ${api.modo === "demo" ? `<div class="banner info" style="margin-top:1rem;display:block"><strong>Modo demostración.</strong> Entra con un rol:<div class="demo-users">
     <button class="btn sec sm" data-demo="tutora@rumbo.test">Tutora (Ing. Rosa Quispe)</button><button class="btn sec sm" data-demo="coordinacion@rumbo.test">Coordinación de Bienestar</button><button class="btn sec sm" data-demo="ti@rumbo.test">Responsable de TI</button></div></div>`
   : '<p class="hint" style="margin-top:.8rem">Las cuentas de prueba del PMV están en el informe del proyecto. En la versión final, el ingreso será con el SSO institucional.</p>'}</div>`;
V.tutorados = async () => { const F = S.filtro; const all = await api.riesgoActual(); const t0 = performance.now(); const ord = {alto:0, medio:1, bajo:2};
  const cursos = [...new Set(all.map(s => s.curso_critico).filter(Boolean))].sort(); const carreras = [...new Set(all.map(s => s.carrera))].sort();
  const list = all.filter(s => (!F.nivel || s.nivel === F.nivel) && (!F.curso || s.curso_critico === F.curso) && (!F.carrera || s.carrera === F.carrera) && (!F.q || (s.nombres + s.codigo).toLowerCase().includes(F.q.toLowerCase())))
    .sort((a, b) => (ord[a.nivel] ?? 3) - (ord[b.nivel] ?? 3) || (b.puntaje || 0) - (a.puntaje || 0));
  const c = n => all.filter(s => s.nivel === n).length; const av = await api.avisos();
  const aTiempo = av.filter(a => a.estado === "atendida" && a.horas <= 72).length; const pct = av.length ? Math.round(aTiempo / av.length * 100) : 0;
  const ms = Math.max(1, Math.round(performance.now() - t0));
  return shell("tutorados", `
  <div class="grid g4" style="margin-bottom:1rem">
   <div class="card kpi"><small class="muted">Estudiantes</small><b>${all.length}</b></div>
   <div class="card kpi"><small class="muted">Riesgo alto</small><b style="color:var(--bad)">${c("alto")}</b></div>
   <div class="card kpi"><small class="muted">Riesgo medio</small><b style="color:var(--warn)">${c("medio")}</b></div>
   <div class="card kpi"><small class="muted">Avisos atendidos en 72 h</small><b>${pct} %</b><small class="muted">${aTiempo} de ${av.length} avisos · meta 80 %</small></div></div>
  <div class="card"><form class="filters" id="flt" role="search" aria-label="Filtros" onsubmit="return false">
   <div><label for="f-q">Buscar</label><input type="search" id="f-q" placeholder="Nombre o código" value="${esc(F.q)}"></div>
   <div><label for="f-n">Nivel</label><select id="f-n"><option value="">Todos</option>${["alto","medio","bajo"].map(n => `<option value="${n}" ${F.nivel === n ? "selected" : ""}>${NIVEL_TXT[n]}</option>`).join("")}</select></div>
   <div><label for="f-c">Curso crítico</label><select id="f-c"><option value="">Todos</option>${cursos.map(x => `<option ${F.curso === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
   <div><label for="f-k">Carrera</label><select id="f-k"><option value="">Todas</option>${carreras.map(x => `<option ${F.carrera === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div></form>
   <p class="hint" aria-live="polite">${list.length} resultado(s) · filtrado en ${ms} ms · ordenado por nivel de riesgo · último cálculo: ${fmtFecha(all.map(s => s.fecha_calculo).sort().pop())}</p>
   <div style="overflow:auto"><table><caption class="sr">Estudiantes ordenados por riesgo</caption><thead><tr><th>Estudiante</th><th>Carrera</th><th>Curso crítico</th><th>Nivel</th><th>Tendencia</th><th>Asistencia</th><th>Promedio</th></tr></thead><tbody>
   ${list.map(s => `<tr class="clickable" tabindex="0" data-st="${s.id}"><td><strong>${esc(s.nombres)}</strong><br><small class="muted">${esc(s.codigo)}</small></td><td>${esc(s.carrera)}</td><td>${esc(s.curso_critico || "—")}</td><td>${lvl(s.nivel)}</td><td>${trendSVG(s.historial)}</td><td>${s.asistencia ?? "—"} %</td><td>${s.promedio != null ? Number(s.promedio).toFixed(1) : "—"}</td></tr>`).join("")}
   </tbody></table></div>
   ${U.rol === "tutor" ? '<p class="hint" style="margin-top:.6rem">Prueba de permisos (HU17): <button class="btn ghost sm" id="otro">abrir el estudiante U202609911, que no es tu tutorado</button></p>' : ""}</div>`); };
V.estudiante = async () => { const id = S.st; if (!id) { go("tutorados"); return null; }
  const d = await api.verEstudiante(id); if (d.denegado) { S.denied = "Detalle del estudiante (no es tu tutorado)"; go("denegado"); return null; }
  const s = d.estudiante, f = d.factores || {};
  const FAC = [["asistencia","Asistencia (%)"],["promedio","Promedio parcial"],["desaprobadas","Evaluaciones desaprobadas"],["inactividad","Días sin ingresar al aula virtual"]];
  return shell("estudiante", `<div class="grid g2">
   <div class="card"><div class="row"><div class="avatar" aria-hidden="true">${esc(s.nombres.split(" ").map(x => x[0]).join("").slice(0,2))}</div><div><strong>${esc(s.nombres)}</strong><br><small class="muted">${esc(s.codigo)} · ${esc(s.carrera)} · ${s.ciclo}.° ciclo</small></div><span class="spacer"></span>${lvl(s.nivel)}</div>
    <p style="margin-top:.8rem"><strong>Puntaje de riesgo:</strong> ${s.puntaje ?? "—"} / 100</p>
    <div class="row"><span>Tendencia en los últimos cálculos:</span>${trendSVG(s.historial, 140, 36)}</div>
    <p class="hint">Test de orientación: ${d.test ? (d.test.completado ? "completado" : "en curso") + (d.test.compartido && d.test.resultado ? " · resultado compartido: " + esc(d.test.resultado) : " · resultado no compartido") : "no iniciado"}</p>
    ${U.rol === "tutor" ? `<div class="row" style="margin-top:.8rem"><button class="btn" id="go-tut">Registrar tutoría</button></div>` : ""}</div>
   <div class="card"><h2>Factores que explican el nivel</h2><table><thead><tr><th>Factor</th><th>Valor</th><th>Estado</th><th>Peso</th></tr></thead><tbody>
    ${FAC.map(([k, n]) => f[k] ? `<tr><td>${n}<br><small class="muted">Umbral: ${f[k].umbral}</small></td><td>${f[k].valor}</td><td>${f[k].fuera ? '<span class="chip alto">Fuera del umbral</span>' : '<span class="chip bajo">Dentro</span>'}</td><td>${f[k].peso} %</td></tr>` : "").join("")}</tbody></table>
    <p class="hint">Calculado el ${fmtFecha(s.fecha_calculo)} con las reglas vigentes.</p></div></div>
  <div class="card" style="margin-top:1rem"><h2>Historial de tutorías</h2>${d.tutorias.length ? `<table><thead><tr><th>Fecha</th><th>Modalidad</th><th>Acuerdos y plan de acción</th><th>Seguimiento</th></tr></thead><tbody>${d.tutorias.map(t => `<tr><td>${fmtDia(t.fecha)}</td><td>${esc(t.modalidad)}</td><td>${esc(t.acuerdos)}</td><td>${t.seguimiento ? fmtDia(t.seguimiento) : "—"}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">Sin tutorías registradas.</p>'}</div>`,
  `<a class="btn sec sm" href="#tutorados">← Volver</a>`); };
V.tutoria = async () => { const all = (await api.riesgoActual()).sort((a, b) => a.nombres.localeCompare(b.nombres)); const hoy = hoyISO();
  return shell("tutoria", `<form class="card" id="tu-f" novalidate style="max-width:780px">
   <div class="grid g2" style="gap:0 1rem">
    <div><label for="tu-e">Estudiante</label><select id="tu-e"><option value="">Selecciona un tutorado</option>${all.map(s => `<option value="${s.id}" ${S.pre === s.id ? "selected" : ""}>${esc(s.nombres)} – ${esc(s.codigo)}${s.nivel === "alto" ? " (riesgo alto)" : ""}</option>`).join("")}</select></div>
    <div><label for="tu-m">Modalidad</label><select id="tu-m"><option>Presencial</option><option>Virtual</option></select></div>
    <div><label for="tu-d">Fecha de la sesión</label><input type="date" id="tu-d" max="${hoy}" value="${hoy}"></div>
    <div><label for="tu-s">Fecha de seguimiento (opcional)</label><input type="date" id="tu-s" min="${hoy}"></div></div>
   <label for="tu-a">Acuerdos y plan de acción</label><textarea id="tu-a" maxlength="1000" placeholder="Ej.: asistirá a la asesoría de Matemática Básica los martes; armará un horario semanal de estudio."></textarea>
   <div class="hint"><span id="tu-c">0</span>/1000 caracteres · mínimo 20</div>
   <div class="row" style="margin-top:1rem"><button class="btn" id="tu-go">Guardar tutoría</button><a class="btn sec" href="#tutorados">Cancelar</a></div>
   <p class="hint">Registro confidencial: solo lo ven la tutora asignada y Coordinación de Bienestar. Al guardarlo, los avisos abiertos del estudiante pasan a «Atendido».</p></form>`); };
V.avisos = async () => { const av = await api.avisos(); const coord = U.rol === "coordinador"; const abiertos = av.filter(a => a.estado !== "atendida");
  const fila = a => { const p = Math.min(100, Math.round(a.horas / 72 * 100));
    return `<tr><td><strong>${esc(a.nombres)}</strong><br><small class="muted">${esc(a.codigo)}</small></td><td>${lvl(a.nivel)}</td><td>${fmtFecha(a.fecha_envio)}</td>
     <td>${a.horas} h${a.estado !== "atendida" ? `<div class="bar" style="margin-top:.3rem;width:110px" aria-hidden="true"><span style="width:${p}%;background:${a.horas >= 72 ? "var(--bad)" : a.horas >= 48 ? "#d68a00" : "var(--ok)"}"></span></div>` : ""}</td>
     <td>${a.estado === "atendida" ? '<span class="chip bajo">Atendido</span>' : a.estado === "escalada" ? '<span class="chip alto">Escalado</span>' : '<span class="chip medio">Pendiente</span>'}</td>
     <td>${a.estado !== "atendida" ? `<button class="btn sm" data-aviso="${a.id}">Registrar contacto</button>` : ""}</td></tr>`; };
  return shell("avisos", `${coord ? '<div class="banner warn">Los avisos «Escalados» pasaron 72 horas sin que la tutora registrara contacto.</div>' : '<div class="banner info">Contacta a cada estudiante antes de 72 horas. Pasado ese plazo, el aviso se escala a Coordinación de Bienestar.</div>'}
   <div class="card"><h2>Abiertos (${abiertos.length})</h2>${abiertos.length ? `<div style="overflow:auto"><table><thead><tr><th>Estudiante</th><th>Nivel</th><th>Enviado</th><th>Tiempo</th><th>Estado</th><th></th></tr></thead><tbody>${abiertos.slice().sort((a, b) => b.horas - a.horas).map(fila).join("")}</tbody></table></div>` : '<p class="muted">No hay avisos abiertos.</p>'}</div>
   <details class="card" style="margin-top:1rem"><summary><strong>Atendidos (${av.length - abiertos.length})</strong></summary><div style="overflow:auto"><table><thead><tr><th>Estudiante</th><th>Nivel</th><th>Enviado</th><th>Tiempo de atención</th><th>Estado</th><th></th></tr></thead><tbody>${av.filter(a => a.estado === "atendida").map(fila).join("")}</tbody></table></div></details>`); };
V.reglas = async () => { const R = await api.reglas();
  const inp = (id, v, mn, mx, st, lab) => `<input type="number" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}" aria-label="${lab}">`;
  return shell("reglas", `<form class="card" id="rg-f" novalidate style="max-width:820px">
   <p class="muted">El puntaje suma el peso de cada factor que queda fuera de su umbral. Riesgo alto: 60 o más · medio: de 30 a 59 · bajo: menos de 30.</p>
   <table><thead><tr><th>Factor</th><th>Umbral</th><th>Peso (%)</th></tr></thead><tbody>
    <tr><td>Asistencia menor a (%)</td><td>${inp("r-a", R.umbral_asistencia, 50, 100, 1, "Umbral de asistencia")}</td><td>${inp("w-a", R.peso_asistencia, 0, 100, 1, "Peso de asistencia")}</td></tr>
    <tr><td>Promedio menor a</td><td>${inp("r-p", R.umbral_promedio, 5, 20, 0.5, "Umbral de promedio")}</td><td>${inp("w-p", R.peso_promedio, 0, 100, 1, "Peso de promedio")}</td></tr>
    <tr><td>Evaluaciones desaprobadas desde</td><td>${inp("r-d", R.umbral_desaprobadas, 1, 10, 1, "Umbral de desaprobadas")}</td><td>${inp("w-d", R.peso_desaprobadas, 0, 100, 1, "Peso de desaprobadas")}</td></tr>
    <tr><td>Días sin ingresar desde</td><td>${inp("r-i", R.umbral_inactividad, 1, 60, 1, "Umbral de inactividad")}</td><td>${inp("w-i", R.peso_inactividad, 0, 100, 1, "Peso de inactividad")}</td></tr></tbody></table>
   <p id="w-sum" class="hint" aria-live="polite"></p><div id="rg-err" class="err" role="alert"></div>
   <div class="row" style="margin-top:.8rem"><button class="btn" id="rg-go">Guardar y recalcular</button><button type="button" class="btn sec" id="rg-def">Valores recomendados</button></div>
   <p class="hint">Al guardar, el semáforo se recalcula para todos los estudiantes y el cambio queda en la auditoría.</p></form>`); };
V.auditoria = async () => { const rows = await api.auditoria(); const f = S.af;
  return shell("auditoria", `<div class="card"><div class="row" style="margin-bottom:.6rem"><label for="au-f" style="margin:0">Resultado</label><select id="au-f" style="max-width:200px"><option value="">Todos</option><option ${f === "Permitido" ? "selected" : ""}>Permitido</option><option ${f === "Denegado" ? "selected" : ""}>Denegado</option></select><span class="spacer"></span><button class="btn sec sm" id="au-r">Actualizar</button></div>
   ${rows.length ? `<div style="overflow:auto"><table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Recurso</th><th>Resultado</th></tr></thead><tbody>
   ${rows.filter(a => !f || a.resultado === f).map(a => `<tr><td>${fmtFecha(a.fecha)}</td><td>${esc(a.correo || "—")}</td><td>${esc(a.accion)}</td><td>${esc(a.recurso || "")}</td><td>${a.resultado === "Denegado" ? '<span class="chip alto">Denegado</span>' : '<span class="chip bajo">Permitido</span>'}</td></tr>`).join("")}</tbody></table></div>` : '<p class="muted">Aún no hay registros.</p>'}
   <p class="hint">Registro de solo lectura: ningún rol puede editarlo ni borrarlo.</p></div>`); };
V.importar = async () => { const cs = await api.cargas();
  return shell("importar", `<div class="grid g2">
   <div class="card"><h2>Nueva carga</h2><p class="muted">Archivo CSV (separado por comas o punto y coma) con las columnas <code>codigo, curso, periodo, evaluacion, nota, asistencia</code>. Columna opcional: <code>dias_sin_acceso</code>.</p>
    <label for="imp-f">Archivo CSV</label><input type="file" id="imp-f" accept=".csv,text/csv">
    <div class="hint">Máximo 10 MB. Nota de 0 a 20 y asistencia de 0 a 100. Si una fila tiene errores, no se carga nada.</div>
    <p class="hint" style="margin-top:.6rem">Archivos de ejemplo: <a href="ejemplos/notas_validas.csv" download>notas_validas.csv</a> · <a href="ejemplos/notas_con_errores.csv" download>notas_con_errores.csv</a></p>
    <div id="imp-prev"></div><div id="imp-res" aria-live="polite"></div></div>
   <div class="card"><h2>Historial de cargas</h2>${cs.length ? `<table><thead><tr><th>Fecha</th><th>Archivo</th><th>Procesados</th><th>Rechazados</th></tr></thead><tbody>
    ${cs.map(c => `<tr><td>${fmtFecha(c.fecha)}<br><small class="muted">${esc(c.correo || "")}</small></td><td>${esc(c.archivo)}</td><td>${c.procesados}</td><td>${c.rechazados}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">Aún no hay cargas.</p>'}</div></div>`); };
V.denegado = async () => shell("denegado", `<div class="card" style="max-width:640px;text-align:center;padding:2rem">
   <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#b3261e" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
   <h2 style="margin-top:.6rem">No tienes permiso para ver este contenido</h2>
   <p class="muted">Tu rol no tiene acceso a «${esc(S.denied || "el recurso solicitado")}». El intento quedó registrado en la auditoría.</p>
   <a class="btn" href="#${MENU[U.rol][0][0]}">Volver a mi inicio</a></div>`);
const r2 = (id, texto, ancla) => async () => shell(id, `<div class="card r2" style="max-width:720px"><span class="chip r2c">Release 2 · Sprints 4 a 6</span>
  <p style="margin-top:.6rem">${texto}</p><p>Esta función no forma parte del PMV. Su diseño se puede revisar en el prototipo navegable:</p>
  <a class="btn sec" href="prototipo.html#${ancla}">Ver prototipo de «${esc(TITULO[id])}»</a></div>`);
V["r2-mentores"] = r2("r2-mentores", "Coordinación verificará a los mentores, revisará sus horas y emitirá constancias.", "web-mentores");
V["r2-moderacion"] = r2("r2-moderacion", "Bandeja de materiales reportados por los estudiantes para mantenerlos o retirarlos.", "web-moderacion");
V["r2-reportes"] = r2("r2-reportes", "Retención y distribución de riesgo por carrera y ciclo, con exportación a Excel y PDF.", "web-reportes");
V["r2-rendimiento"] = r2("r2-rendimiento", "Panel de disponibilidad, tiempo de respuesta p95, tasa de errores y usuarios concurrentes.", "web-monitoreo");

/* ===================== enrutador ===================== */
async function render(){
  const view = $("#view"); let id = location.hash.slice(1);
  try {
    U = await api.usuario();
    if (id === "salir") { await api.logout(); U = null; history.replaceState(null, "", "#login"); id = "login"; }
    if (id === "reiniciar" && api.modo === "demo") { api.reiniciar(); toast("Datos de demostración reiniciados"); U = null; history.replaceState(null, "", "#login"); id = "login"; }
    if (!U) id = "login";
    else if (U.rol === "estudiante") { view.innerHTML = `<div class="card login-box"><h1>Cuenta de estudiante</h1><p>Los estudiantes usan la <a href="app.html">app móvil de RUMBO_UC</a>.</p><a class="btn sec" href="#salir">Cerrar sesión</a></div>`; return; }
    else { if (!V[id] || id === "login") id = MENU[U.rol][0][0];
      if (ACCESS[id] && !ACCESS[id].includes(U.rol)) { S.denied = TITULO[id]; api.registrarDenegado(TITULO[id]); id = "denegado"; } }
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    view.innerHTML = spinner();
    const html = await V[id](); if (html === null) return;
    view.innerHTML = html; document.title = "RUMBO_UC – " + (TITULO[id] || "Ingreso"); window.scrollTo(0, 0);
    bind(id);
  } catch (e) { view.innerHTML = `<div class="card login-box"><div class="banner bad" role="alert">${esc(msgError(e))}</div><button class="btn" onclick="render()">Reintentar</button> <a class="btn sec" href="#salir">Cerrar sesión</a></div>`; }
}
window.render = render;
function bind(id){
  const on = (s, ev, fn) => { const e = $(s); if (e) e.addEventListener(ev, fn); };
  if (id === "login") {
    const entrar = async (email, pass) => { const b = $("#lg-go"); b.disabled = true; b.textContent = "Ingresando…"; $("#lg-err").textContent = "";
      try { await api.login(email, pass); go("inicio"); } catch (e) { $("#lg-err").textContent = msgError(e); b.disabled = false; b.textContent = "Ingresar"; } };
    on("#lg-f","submit", e => { e.preventDefault(); const em = $("#lg-e"), pw = $("#lg-p");
      const a = setErr(em, !em.value.trim() ? "Escribe tu correo." : !/^\S+@\S+\.\S+$/.test(em.value.trim()) ? "El correo no tiene un formato válido." : "");
      const b = setErr(pw, pw.value ? "" : "Escribe tu contraseña."); if (a && b) entrar(em.value.trim(), pw.value); });
    $$("[data-demo]").forEach(b => b.addEventListener("click", () => entrar(b.dataset.demo, "demo")));
  }
  if (id === "tutorados") { const F = S.filtro;
    const upd = () => { F.q = $("#f-q").value; F.nivel = $("#f-n").value; F.curso = $("#f-c").value; F.carrera = $("#f-k").value;
      const foc = document.activeElement.id; const p = document.activeElement.selectionStart; render().then(() => { const n = document.getElementById(foc); if (n) { n.focus(); if (foc === "f-q") n.setSelectionRange(p, p); } }); };
    ["#f-n","#f-c","#f-k"].forEach(s => on(s, "change", upd)); let tmr; on("#f-q","input", () => { clearTimeout(tmr); tmr = setTimeout(upd, 250); });
    $$("tr[data-st]").forEach(tr => { const open = () => { S.st = Number(tr.dataset.st); go("estudiante"); }; tr.addEventListener("click", open); tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } }); });
    on("#otro","click", () => { S.st = 41; go("estudiante"); }); }
  if (id === "estudiante") on("#go-tut","click", () => { S.pre = S.st; go("tutoria"); });
  if (id === "tutoria") { on("#tu-a","input", e => $("#tu-c").textContent = e.target.value.length);
    on("#tu-f","submit", async e => { e.preventDefault(); const es = $("#tu-e"), d = $("#tu-d"), s = $("#tu-s"), a = $("#tu-a"); let ok = true; const hoy = hoyISO();
      ok = setErr(es, es.value ? "" : "Selecciona al estudiante.") && ok;
      ok = setErr(d, !d.value ? "Indica la fecha de la sesión." : d.value > hoy ? "La fecha de la sesión no puede ser futura." : "") && ok;
      ok = setErr(s, s.value && d.value && s.value <= d.value ? "La fecha de seguimiento debe ser posterior a la sesión." : "") && ok;
      ok = setErr(a, a.value.trim().length < 20 ? "Describe los acuerdos con al menos 20 caracteres." : "") && ok;
      if (!ok) { $("[aria-invalid=true]").focus(); return; }
      const b = $("#tu-go"); b.disabled = true;
      try { await api.registrarTutoria({id_estudiante:Number(es.value), fecha:d.value, modalidad:$("#tu-m").value, acuerdos:a.value.trim(), fecha_seguimiento:s.value || null});
        toast("Tutoría registrada" + (s.value ? " · seguimiento el " + fmtDia(s.value) : "")); S.st = Number(es.value); S.pre = null; go("estudiante"); }
      catch (er) { toast(msgError(er)); b.disabled = false; } }); }
  if (id === "avisos") $$("[data-aviso]").forEach(b => b.addEventListener("click", async () => { b.disabled = true; try { await api.atenderAlerta(Number(b.dataset.aviso)); toast("Contacto registrado: el aviso pasó a «Atendido»"); render(); } catch (e) { toast(msgError(e)); b.disabled = false; } }));
  if (id === "reglas") { const ws = ["#w-a","#w-p","#w-d","#w-i"]; const sum = () => { const s = ws.reduce((a, k) => a + Number($(k).value || 0), 0); $("#w-sum").textContent = `Suma de pesos: ${s} %` + (s === 100 ? " ✓" : " (debe ser 100 %)"); return s; };
    ws.forEach(k => on(k, "input", sum)); sum();
    on("#rg-def","click", () => { [["#r-a",75],["#r-p",11],["#r-d",2],["#r-i",7],["#w-a",35],["#w-p",30],["#w-d",20],["#w-i",15]].forEach(([k, v]) => $(k).value = v); sum(); });
    on("#rg-f","submit", async e => { e.preventDefault(); let ok = true;
      [["#r-a",50,100],["#r-p",5,20],["#r-d",1,10],["#r-i",1,60]].forEach(([k, mn, mx]) => { const v = Number($(k).value); ok = setErr($(k), $(k).value === "" || v < mn || v > mx ? `Valor entre ${mn} y ${mx}.` : "") && ok; });
      if (sum() !== 100) { $("#rg-err").textContent = "Los pesos deben sumar 100 %."; ok = false; } else $("#rg-err").textContent = "";
      if (!ok) return; const b = $("#rg-go"); b.disabled = true; b.textContent = "Recalculando…";
      try { const r = await api.guardarReglas({umbral_asistencia:Number($("#r-a").value), umbral_promedio:Number($("#r-p").value), umbral_desaprobadas:Number($("#r-d").value), umbral_inactividad:Number($("#r-i").value),
          peso_asistencia:Number($("#w-a").value), peso_promedio:Number($("#w-p").value), peso_desaprobadas:Number($("#w-d").value), peso_inactividad:Number($("#w-i").value)});
        toast(`Reglas guardadas. Estudiantes en riesgo alto: ${r.antes} → ${r.despues}`); } catch (er) { $("#rg-err").textContent = msgError(er); }
      b.disabled = false; b.textContent = "Guardar y recalcular"; }); }
  if (id === "auditoria") { on("#au-f","change", e => { S.af = e.target.value; render(); }); on("#au-r","click", () => render()); }
  if (id === "importar") on("#imp-f","change", e => { const inp = e.target; const f = inp.files[0]; $("#imp-res").innerHTML = ""; $("#imp-prev").innerHTML = ""; if (!f) return;
    if (!/\.csv$/i.test(f.name)) { setErr(inp, "Solo se aceptan archivos .csv."); return; } if (f.size > 10 * 1024 * 1024) { setErr(inp, "El archivo supera los 10 MB."); return; } setErr(inp, "");
    const rd = new FileReader(); rd.onload = () => { const p = parseCSV(String(rd.result)); const falt = COLUMNAS_CSV.filter(c => !p.cabecera.includes(c));
      if (falt.length) { $("#imp-res").innerHTML = `<div class="banner bad" role="alert">Faltan columnas obligatorias: ${esc(falt.join(", "))}. No se cargó nada.</div>`; return; }
      if (!p.filas.length) { $("#imp-res").innerHTML = '<div class="banner bad" role="alert">El archivo no tiene filas de datos.</div>'; return; }
      $("#imp-prev").innerHTML = `<div class="banner info" style="display:block"><strong>${esc(f.name)}</strong>: ${p.filas.length} fila(s) listas para validar.<div class="row" style="margin-top:.5rem"><button class="btn sm" id="imp-go">Validar e importar</button></div></div>`;
      $("#imp-go").onclick = async () => { $("#imp-go").disabled = true; $("#imp-res").innerHTML = spinner("Validando e importando…");
        try { const r = await api.importar(p.filas.map(o => ({codigo:o.codigo, curso:o.curso, periodo:o.periodo, evaluacion:o.evaluacion, nota:o.nota, asistencia:o.asistencia, dias_sin_acceso:o.dias_sin_acceso})), f.name);
          $("#imp-prev").innerHTML = "";
          if (!r.ok) $("#imp-res").innerHTML = `<div class="banner bad" role="alert"><div><strong>Carga rechazada.</strong> ${r.rechazados} fila(s) con errores; no se modificaron los datos existentes.</div></div><table><thead><tr><th>Fila</th><th>Motivo</th></tr></thead><tbody>${r.errores.map(x => `<tr><td>${x.fila}</td><td>${esc(x.motivo)}</td></tr>`).join("")}</tbody></table><button class="btn sec sm" style="margin-top:.6rem" onclick="render()">Actualizar historial</button>`;
          else $("#imp-res").innerHTML = `<div class="banner ok" role="status"><div><strong>Carga completada.</strong> ${r.procesados} registro(s) procesados. El semáforo se recalculó y se generaron ${r.alertas} alerta(s) y aviso(s).</div></div><button class="btn sec sm" onclick="render()">Actualizar historial</button>`;
        } catch (er) { $("#imp-res").innerHTML = `<div class="banner bad" role="alert">${esc(msgError(er))}</div>`; } }; };
    rd.readAsText(f, "UTF-8"); });
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
